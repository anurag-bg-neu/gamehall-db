<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <title>GameHall</title>
</head>
<body>
  <section class="hero">
    <div class="hero-eyebrow">PLAYER SELECT</div>
    <h1>GAMEHALL</h1>
    <p>Legends pulled from different worlds, now loaded live from a PostgreSQL database. Pick a fighter to see their full stat card.</p>
    <a href="#roster" class="hero-cta">Select Your Fighter</a>
  </section>

  <main class="roster" id="roster">
    <h2 class="roster-heading">The Roster</h2>
    <p class="roster-sub">Every character below has a dedicated stat card &mdash; click one to open it.</p>

    <form class="search-bar" id="search-form" role="search">
      <select id="search-field" aria-label="Search by">
        <option value="name">Name</option>
        <option value="game">Game</option>
        <option value="role">Role</option>
      </select>
      <input type="search" id="search-input" placeholder="Search fighters..." aria-label="Search term" />
      <button type="submit">Search</button>
    </form>

    <p class="roster-status" id="roster-status" aria-live="polite">Loading roster...</p>
    <div class="grid-cards" id="roster-grid"></div>
  </main>

  <script src="/src/js/characters.js"></script>
</body>
</html>
